apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana/username
    - secretKey: admin-password
      remoteRef:
        key: grafana/password
