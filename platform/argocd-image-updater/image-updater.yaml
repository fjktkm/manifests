apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: image-updater
  namespace: argocd
spec:
  writeBackConfig:
    method: git:secret:argocd/git-creds
    gitConfig:
      writeBackTarget: kustomization
  applicationRefs:
    - namePattern: pdf2image
      images:
        - alias: pdf2image
          imageName: ghcr.io/fjktkm/pdf2image
    - namePattern: nitech-status
      images:
        - alias: gatus
          imageName: ghcr.io/twin/gatus
    - namePattern: duel-masters-ml
      images:
        - alias: dm-web
          imageName: ghcr.io/mass-ms/duel-masters-ml
          commonUpdateSettings:
            allowTags: regexp:^\d+\.\d+\.\d+$
            pullSecret: pullsecret:argocd/duel-masters-ml-ghcr-pull
            platforms:
              - linux/amd64
        - alias: dm-scanner
          imageName: ghcr.io/mass-ms/duel-masters-ml/dm-scanner
          commonUpdateSettings:
            allowTags: regexp:^\d+\.\d+\.\d+$
            pullSecret: pullsecret:argocd/duel-masters-ml-ghcr-pull
            platforms:
              - linux/amd64
        - alias: cloudflared
          imageName: cloudflare/cloudflared
          commonUpdateSettings:
            allowTags: regexp:^\d+\.\d+\.\d+$
    - namePattern: cloudflared
      images:
        - alias: cloudflared
          imageName: cloudflare/cloudflared
          commonUpdateSettings:
            allowTags: regexp:^\d+\.\d+\.\d+$
