apiVersion: apps/v1
kind: Deployment
metadata:
  name: dm-scanner
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dm-scanner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dm-scanner
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: duel-masters-ml-ghcr-pull
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dm-scanner
          image: ghcr.io/mass-ms/duel-masters-ml/dm-scanner
          ports:
            - name: http
              containerPort: 8560
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: models
              mountPath: /models
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: dm-scanner-models
        - name: temporary-files
          emptyDir:
            sizeLimit: 512Mi
