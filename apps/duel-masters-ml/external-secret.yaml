apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: duel-masters-ml
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  data:
    - secretKey: owner-email
      remoteRef:
        key: duel-masters-ml/owner-email
    - secretKey: news-webhook-url
      remoteRef:
        key: duel-masters-ml/news-webhook-url
    - secretKey: news-thread-id
      remoteRef:
        key: duel-masters-ml/news-thread-id
