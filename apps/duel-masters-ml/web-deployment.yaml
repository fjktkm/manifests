apiVersion: apps/v1
kind: Deployment
metadata:
  name: dm-web
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dm-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dm-web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: duel-masters-ml-ghcr-pull
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dm-web
          image: ghcr.io/mass-ms/duel-masters-ml
          env:
            - name: DM_SCAN_URL
              value: http://dm-scanner:8560
            - name: DM_ACCESS_TEAM_DOMAIN
              value: mass-ms.cloudflareaccess.com
            - name: DM_ACCESS_AUD
              value: b42b7c809a435d3e58171b801726eebdfd2f1be875d90ad6365781517bf75036
            - name: DM_PUBLIC_URL
              value: https://dm.mass-hub.dev
            - name: DM_OWNER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: duel-masters-ml
                  key: owner-email
            - name: DM_NEWS_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: duel-masters-ml
                  key: news-webhook-url
            - name: DM_NEWS_THREAD_ID
              valueFrom:
                secretKeyRef:
                  name: duel-masters-ml
                  key: news-thread-id
          ports:
            - name: http
              containerPort: 8550
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: temporary-files
              mountPath: /tmp
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dm-web-data
        - name: temporary-files
          emptyDir:
            sizeLimit: 1Gi
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
