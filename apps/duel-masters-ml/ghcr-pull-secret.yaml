apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: duel-masters-ml-ghcr-pull
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: duel-masters-ml-ghcr-pull/username
    - secretKey: password
      remoteRef:
        key: duel-masters-ml-ghcr-pull/credential
