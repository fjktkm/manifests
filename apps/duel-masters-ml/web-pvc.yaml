apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dm-web-data
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/dm-web-data-daily-snapshot: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
