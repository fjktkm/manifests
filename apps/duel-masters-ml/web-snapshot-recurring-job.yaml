apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: dm-web-data-daily-snapshot
  namespace: longhorn-system
spec:
  name: dm-web-data-daily-snapshot
  task: snapshot
  # 06:00 JST with the current kube-controller-manager time zone.
  cron: "0 6 * * *"
  retain: 7
  concurrency: 1
  groups: []
  labels: {}
