apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: dm-web-data-daily-snapshot
  namespace: longhorn-system
spec:
  name: dm-web-data-daily-snapshot
  task: snapshot
  # 06:00 JST (Longhorn evaluates cron in UTC)
  cron: "0 21 * * *"
  retain: 7
  concurrency: 1
  groups: []
  labels: {}
