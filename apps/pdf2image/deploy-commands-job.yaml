apiVersion: batch/v1
kind: Job
metadata:
  name: pdf2image-deploy-commands
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pdf2image-deploy-commands
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: deploy-commands
          image: ghcr.io/fjktkm/pdf2image
          command:
            - node
            - dist/deploy-commands.js
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: pdf2image
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
