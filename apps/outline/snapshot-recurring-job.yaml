apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: outline-daily-snapshot
  namespace: longhorn-system
spec:
  name: outline-daily-snapshot
  task: snapshot
  # 05:00 JST with the current kube-controller-manager time zone.
  cron: "0 5 * * *"
  retain: 7
  concurrency: 1
  groups: []
  labels: {}
