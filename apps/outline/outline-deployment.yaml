apiVersion: apps/v1
kind: Deployment
metadata:
  name: outline
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: outline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outline
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outline
          image: outlinewiki/outline
          envFrom:
            - secretRef:
                name: outline
          env:
            - name: NODE_ENV
              value: production
            - name: URL
              value: https://outline.fjktkm.com
            - name: PORT
              value: "3000"
            - name: FORCE_HTTPS
              value: "false"
            - name: PGSSLMODE
              value: disable
            - name: REDIS_URL
              value: redis://outline-redis:6379
            - name: FILE_STORAGE
              value: local
            - name: FILE_STORAGE_LOCAL_ROOT_DIR
              value: /var/lib/outline/data
            - name: FILE_STORAGE_UPLOAD_MAX_SIZE
              value: "96000000"
            - name: DEFAULT_LANGUAGE
              value: ja_JP
            - name: ENABLE_UPDATES
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /_health
              port: http
          livenessProbe:
            httpGet:
              path: /_health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/outline/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: outline-data
