apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .secretKey }}"
        UTILS_SECRET: "{{ .utilsSecret }}"
        DATABASE_URL: "postgres://outline:{{ .postgresPassword | urlquery }}@outline-postgres:5432/outline"
        POSTGRES_PASSWORD: "{{ .postgresPassword }}"
        DISCORD_CLIENT_ID: "{{ .discordClientId }}"
        DISCORD_CLIENT_SECRET: "{{ .discordClientSecret }}"
        DISCORD_SERVER_ID: "{{ .discordServerId }}"
  data:
    - secretKey: secretKey
      remoteRef:
        key: outline/secret-key
    - secretKey: utilsSecret
      remoteRef:
        key: outline/utils-secret
    - secretKey: postgresPassword
      remoteRef:
        key: outline/postgres-password
    - secretKey: discordClientId
      remoteRef:
        key: outline/discord-client-id
    - secretKey: discordClientSecret
      remoteRef:
        key: outline/discord-client-secret
    - secretKey: discordServerId
      remoteRef:
        key: outline/discord-server-id
