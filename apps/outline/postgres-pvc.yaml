apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: outline-postgres
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/outline-daily-snapshot: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
