apiVersion: apps/v1
kind: Deployment
metadata:
  name: nitech-status
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nitech-status
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nitech-status
    spec:
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:v5.37.0
          env:
            - name: GATUS_CONFIG_PATH
              value: /config
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: nitech-status-config
        - name: data
          persistentVolumeClaim:
            claimName: nitech-status
