apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pdf2image
  namespace: argocd
spec:
  project: root
  source:
    repoURL: https://github.com/fjktkm/manifests.git
    targetRevision: main
    path: apps/pdf2image
  destination:
    server: https://kubernetes.default.svc
    namespace: workloads
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
