apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-node-scheduling
  namespace: argocd
spec:
  project: root
  source:
    repoURL: https://github.com/fjktkm/manifests.git
    targetRevision: main
    path: platform/longhorn-nodes
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - Validate=false
