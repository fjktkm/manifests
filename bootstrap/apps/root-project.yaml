apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Bootstrap project for this repository.
  sourceRepos:
    - https://github.com/fjktkm/manifests.git
    - https://charts.longhorn.io/
    - https://kubernetes-sigs.github.io/headlamp/
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: workloads
      server: https://kubernetes.default.svc
    - namespace: longhorn-system
      server: https://kubernetes.default.svc
    - namespace: headlamp
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
