apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: root
  source:
    chart: longhorn
    repoURL: https://charts.longhorn.io/
    targetRevision: v1.12.1
    helm:
      values: |
        global:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        defaultSettings:
          taintToleration: "node-role.kubernetes.io/control-plane:NoSchedule"
        persistence:
          defaultClass: true
          dataEngine: v1
          defaultClassReplicaCount: 3
        preUpgradeChecker:
          jobEnabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
