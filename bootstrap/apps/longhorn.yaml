apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: root
  source:
    chart: longhorn
    repoURL: https://charts.longhorn.io/
    targetRevision: v1.12.1
    helm:
      values: |
        global:
          nodeSelector:
            homelab.fjktkm/worker: "true"
        defaultSettings:
          systemManagedComponentsNodeSelector: "homelab.fjktkm/worker:true"
        persistence:
          defaultClass: true
          dataEngine: v1
          defaultClassReplicaCount: 3
        preUpgradeChecker:
          jobEnabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
