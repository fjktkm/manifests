apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: root
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 93.4.0
    helm:
      values: |
        alertmanager:
          enabled: false

        # k3s embeds these components in the k3s process; they are not scrapeable by default.
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false

        prometheusOperator:
          admissionWebhooks:
            enabled: false
          tls:
            enabled: false

        prometheus:
          prometheusSpec:
            retention: 15d
            retentionSize: 18GB
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            scrapeConfigSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 3Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi

        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: community
                  orgId: 1
                  folder: Community
                  type: file
                  disableDeletion: true
                  editable: false
                  options:
                    path: /var/lib/grafana/dashboards/community
          dashboards:
            community:
              longhorn:
                gnetId: 16888
                revision: 14
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
              argocd-operational:
                gnetId: 19993
                revision: 9
              argocd-application:
                gnetId: 19974
                revision: 8
              cloudflared:
                gnetId: 24874
                revision: 4
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
